<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шашки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding: 10px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .status {
            color: #ffd700;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .board-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: #deb887;
            border-radius: 10px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            gap: 0;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }
        
        .cell-dark {
            background: #8b4513;
        }
        
        .cell-light {
            background: #f4d03f;
        }
        
        .cell-selected {
            background: #ffd700 !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .cell-valid {
            cursor: pointer;
        }
        
        .cell-valid::after {
            content: '';
            width: 30%;
            height: 30%;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            position: absolute;
            animation: pulse 1s infinite;
        }
        
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            pointer-events: none; /* Чтобы клики шли на клетку */
        }
        
        .piece-white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border: 2px solid #999;
        }
        
        .piece-black {
            background: radial-gradient(circle at 30% 30%, #444444, #000000);
            border: 2px solid #333;
        }
        
        .piece-king {
            border: 3px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        .piece-king::after {
            content: '♛';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #ffd700;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            background: #ffd700;
            color: #1a1a1a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            min-width: 100px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-secondary {
            background: #444;
            color: white;
        }
        
        .info {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.8); opacity: 0.5; }
        }
        
        /* Адаптация под маленькие экраны */
        @media (max-width: 350px) {
            .header h1 {
                font-size: 20px;
            }
            .btn {
                padding: 10px 15px;
                font-size: 14px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>♟ Шашки</h1>
        <div class="status" id="status">Ход: Белые</div>
    </div>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="newGame()">🔄 Новая игра</button>
        <button class="btn btn-secondary" onclick="closeGame()">✖ Закрыть</button>
    </div>
    
    <div class="info" id="info">Нажмите на шашку, затем на клетку для хода</div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Состояние игры
        let board = [];
        let selectedCell = null;
        let validMoves = [];
        let currentPlayer = 'white';
        let gameOver = false;
        
        // Инициализация
        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            
            // Расстановка шашек
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        if (row < 3) {
                            board[row][col] = { color: 'black', isKing: false };
                        } else if (row > 4) {
                            board[row][col] = { color: 'white', isKing: false };
                        }
                    }
                }
            }
        }
        
        // Отрисовка доски
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    
                    // Определяем цвет клетки
                    if ((row + col) % 2 === 0) {
                        cell.className = 'cell cell-light';
                    } else {
                        cell.className = 'cell cell-dark';
                    }
                    
                    // Подсветка выбранной клетки
                    if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                        cell.classList.add('cell-selected');
                    }
                    
                    // Подсветка доступных ходов
                    if (validMoves.some(move => move.to.row === row && move.to.col === col)) {
                        cell.classList.add('cell-valid');
                    }
                    
                    // Добавляем шашку
                    if (board[row][col]) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        
                        if (board[row][col].color === 'white') {
                            piece.classList.add('piece-white');
                        } else {
                            piece.classList.add('piece-black');
                        }
                        
                        if (board[row][col].isKing) {
                            piece.classList.add('piece-king');
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    // Обработчик клика
                    cell.addEventListener('click', () => onCellClick(row, col));
                    cell.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        onCellClick(row, col);
                    });
                    
                    boardElement.appendChild(cell);
                }
            }
            
            // Обновление статуса
            updateStatus();
        }
        
        // Обновление статуса
        function updateStatus() {
            const statusElement = document.getElementById('status');
            if (gameOver) {
                statusElement.textContent = `🏆 Победили ${currentPlayer === 'white' ? 'Белые' : 'Черные'}!`;
            } else {
                statusElement.textContent = `Ход: ${currentPlayer === 'white' ? 'Белые' : 'Черные'}`;
            }
        }
        
        // Получение возможных ходов
        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece || piece.color !== currentPlayer) return [];
            
            const moves = [];
            const directions = piece.isKing ? [-1, 1] : (piece.color === 'white' ? [-1] : [1]);
            
            // Обычные ходы
            for (const dr of directions) {
                for (const dc of [-1, 1]) {
                    const newRow = row + dr;
                    const newCol = col + dc;
                    
                    if (isValid(newRow, newCol) && !board[newRow][newCol]) {
                        moves.push({
                            from: { row, col },
                            to: { row: newRow, col: newCol },
                            captures: []
                        });
                    }
                }
            }
            
            // Взятие
            for (const dr of [-1, 1]) {
                for (const dc of [-1, 1]) {
                    const captureRow = row + dr;
                    const captureCol = col + dc;
                    const landRow = row + dr * 2;
                    const landCol = col + dc * 2;
                    
                    if (isValid(captureRow, captureCol) && 
                        isValid(landRow, landCol) &&
                        board[captureRow][captureCol] && 
                        board[captureRow][captureCol].color !== piece.color &&
                        !board[landRow][landCol]) {
                        
                        moves.push({
                            from: { row, col },
                            to: { row: landRow, col: landCol },
                            captures: [{ row: captureRow, col: captureCol }]
                        });
                    }
                }
            }
            
            return moves;
        }
        
        // Проверка позиции
        function isValid(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }
        
        // Обработка клика
        function onCellClick(row, col) {
            if (gameOver) return;
            
            // Если есть выбранная шашка и клик по доступному ходу
            const move = validMoves.find(m => m.to.row === row && m.to.col === col);
            if (move) {
                makeMove(move);
                return;
            }
            
            // Выбор шашки
            const piece = board[row][col];
            if (piece && piece.color === currentPlayer) {
                selectedCell = { row, col };
                validMoves = getValidMoves(row, col);
                document.getElementById('info').textContent = 
                    validMoves.length > 0 ? 'Выберите клетку для хода' : 'Нет доступных ходов';
            } else {
                // Отмена выбора
                selectedCell = null;
                validMoves = [];
                document.getElementById('info').textContent = 'Нажмите на шашку, затем на клетку для хода';
            }
            
            renderBoard();
        }
        
        // Выполнение хода
        function makeMove(move) {
            // Перемещение
            const piece = board[move.from.row][move.from.col];
            board[move.to.row][move.to.col] = piece;
            board[move.from.row][move.from.col] = null;
            
            // Взятие
            move.captures.forEach(capture => {
                board[capture.row][capture.col] = null;
            });
            
            // Превращение в дамку
            if ((piece.color === 'white' && move.to.row === 0) ||
                (piece.color === 'black' && move.to.row === 7)) {
                piece.isKing = true;
            }
            
            selectedCell = null;
            validMoves = [];
            
            // Проверка победы
            if (checkWin()) {
                gameOver = true;
                document.getElementById('info').textContent = 'Игра окончена!';
                
                // Отправка результата в бот
                tg.sendData(JSON.stringify({
                    action: 'game_over',
                    winner: currentPlayer
                }));
            }
            
            // Смена хода
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            
            renderBoard();
        }
        
        // Проверка победы
        function checkWin() {
            const whitePieces = board.flat().filter(p => p && p.color === 'white').length;
            const blackPieces = board.flat().filter(p => p && p.color === 'black').length;
            return whitePieces === 0 || blackPieces === 0;
        }
        
        // Новая игра
        function newGame() {
            initBoard();
            selectedCell = null;
            validMoves = [];
            currentPlayer = 'white';
            gameOver = false;
            document.getElementById('info').textContent = 'Новая игра! Ходят белые';
            renderBoard();
        }
        
        // Закрытие
        function closeGame() {
            tg.close();
        }
        
        // Запуск
        initBoard();
        renderBoard();
    </script>
</body>
</html>
