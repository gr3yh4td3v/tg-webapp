<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест</title>
</head>
<body style="background:#1a1a2e;color:#fff;padding:20px;text-align:center;">
    <h2>Тест WebApp</h2>
    <button onclick="send()" style="padding:20px;font-size:20px;background:green;color:white;border:none;border-radius:10px;">
        Отправить тест
    </button>
    <p id="status"></p>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        document.getElementById('status').textContent = 'API: ' + (tg ? 'OK' : 'ERROR');

        function send() {
            if (!tg) {
                alert('Telegram API не загружен');
                return;
            }
            document.getElementById('status').textContent = 'Отправка...';
            
            tg.sendData(JSON.stringify({
                action: 'test',
                text: 'Привет из WebApp!',
                time: new Date().toISOString()
            }));
            
            document.getElementById('status').textContent = 'Отправлено! Проверь консоль бота';
        }
    </script>
</body>
</html>
