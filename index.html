<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шашки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding: 10px;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .status {
            color: #ffd700;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .board-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: #deb887;
            border-radius: 10px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            gap: 0;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }
        
        .cell-dark {
            background: #8b4513;
        }
        
        .cell-light {
            background: #f4d03f;
        }
        
        .cell-selected {
            background: #ffd700 !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .cell-valid {
            cursor: pointer;
        }
        
        .cell-valid::after {
            content: '';
            width: 30%;
            height: 30%;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            position: absolute;
            animation: pulse 1s infinite;
        }
        
        .cell-capture {
            cursor: pointer;
        }
        
        .cell-capture::after {
            content: '';
            width: 40%;
            height: 40%;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            position: absolute;
            animation: pulse 0.5s infinite;
        }
        
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        
        .piece-white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border: 2px solid #999;
        }
        
        .piece-black {
            background: radial-gradient(circle at 30% 30%, #444444, #000000);
            border: 2px solid #333;
        }
        
        .piece-king {
            border: 3px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        .piece-king::after {
            content: '♛';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #ffd700;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        
        .btn {
            background: #ffd700;
            color: #1a1a1a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            min-width: 100px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-secondary {
            background: #444;
            color: white;
        }
        
        .info {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
            width: 100%;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>♟ Шашки</h1>
        <div class="status" id="status">Ход: Белые (Вы)</div>
    </div>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="newGame()">🔄 Новая игра</button>
        <button class="btn btn-secondary" onclick="closeGame()">✖ Закрыть</button>
    </div>
    
    <div class="info" id="info">Вы играете белыми. Нажмите на шашку для выбора</div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Состояние игры
        let board = [];
        let selectedCell = null;
        let validMoves = [];
        let currentPlayer = 'white';
        let gameOver = false;
        let isAIThinking = false;
        const playerColor = 'white';
        const aiColor = 'black';
        
        // Инициализация
        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        if (row < 3) {
                            board[row][col] = { color: 'black', isKing: false };
                        } else if (row > 4) {
                            board[row][col] = { color: 'white', isKing: false };
                        }
                    }
                }
            }
        }
        
        // Отрисовка доски
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    
                    if ((row + col) % 2 === 0) {
                        cell.className = 'cell cell-light';
                    } else {
                        cell.className = 'cell cell-dark';
                    }
                    
                    if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                        cell.classList.add('cell-selected');
                    }
                    
                    // Подсветка ходов
                    validMoves.forEach(move => {
                        if (move.to.row === row && move.to.col === col) {
                            if (move.captures.length > 0) {
                                cell.classList.add('cell-capture');
                            } else {
                                cell.classList.add('cell-valid');
                            }
                        }
                    });
                    
                    if (board[row][col]) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        
                        if (board[row][col].color === 'white') {
                            piece.classList.add('piece-white');
                        } else {
                            piece.classList.add('piece-black');
                        }
                        
                        if (board[row][col].isKing) {
                            piece.classList.add('piece-king');
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    cell.addEventListener('click', () => onCellClick(row, col));
                    cell.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        onCellClick(row, col);
                    });
                    
                    boardElement.appendChild(cell);
                }
            }
            
            updateStatus();
        }
        
        // Обновление статуса
        function updateStatus() {
            const statusElement = document.getElementById('status');
            if (gameOver) {
                statusElement.textContent = currentPlayer === 'white' ? '🏆 Вы победили!' : '🤖 ИИ победил!';
            } else {
                statusElement.textContent = currentPlayer === 'white' ? 'Ход: Вы (белые)' : 'Ход: ИИ (черные)';
            }
        }
        
        // Получение ВСЕХ возможных взятий для игрока
        function getAllCaptures(color) {
            const captures = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] && board[row][col].color === color) {
                        const pieceCaptures = getCaptureMoves(row, col);
                        captures.push(...pieceCaptures);
                    }
                }
            }
            return captures;
        }
        
        // Получение взятий для конкретной шашки
        function getCaptureMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];
            
            const moves = [];
            const directions = piece.isKing ? [-1, 1] : (piece.color === 'white' ? [-1] : [1]);
            
            for (const dr of directions) {
                for (const dc of [-1, 1]) {
                    const captureRow = row + dr;
                    const captureCol = col + dc;
                    const landRow = row + dr * 2;
                    const landCol = col + dc * 2;
                    
                    if (isValid(captureRow, captureCol) && 
                        isValid(landRow, landCol) &&
                        board[captureRow][captureCol] && 
                        board[captureRow][captureCol].color !== piece.color &&
                        !board[landRow][landCol]) {
                        
                        moves.push({
                            from: { row, col },
                            to: { row: landRow, col: landCol },
                            captures: [{ row: captureRow, col: captureCol }]
                        });
                    }
                }
            }
            
            return moves;
        }
        
        // Получение обычных ходов для шашки
        function getNormalMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];
            
            const moves = [];
            const directions = piece.isKing ? [-1, 1] : (piece.color === 'white' ? [-1] : [1]);
            
            for (const dr of directions) {
                for (const dc of [-1, 1]) {
                    const newRow = row + dr;
                    const newCol = col + dc;
                    
                    if (isValid(newRow, newCol) && !board[newRow][newCol]) {
                        moves.push({
                            from: { row, col },
                            to: { row: newRow, col: newCol },
                            captures: []
                        });
                    }
                }
            }
            
            return moves;
        }
        
        // Получение всех ходов для игрока (с приоритетом взятия)
        function getAllMoves(color) {
            const allCaptures = getAllCaptures(color);
            if (allCaptures.length > 0) {
                return allCaptures; // Обязательное взятие
            }
            
            const normalMoves = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] && board[row][col].color === color) {
                        normalMoves.push(...getNormalMoves(row, col));
                    }
                }
            }
            return normalMoves;
        }
        
        // Получение ходов для конкретной шашки (с учетом обязательного взятия)
        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece || piece.color !== currentPlayer) return [];
            
            // Проверяем, есть ли обязательные взятия
            const allCaptures = getAllCaptures(currentPlayer);
            if (allCaptures.length > 0) {
                // Если есть взятия, можно ходить только с взятием
                return getCaptureMoves(row, col);
            }
            
            // Если нет взятий, обычные ходы
            return getNormalMoves(row, col);
        }
        
        // Проверка позиции
        function isValid(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }
        
        // Обработка клика
        function onCellClick(row, col) {
            if (gameOver || isAIThinking || currentPlayer !== playerColor) return;
            
            // Если есть выбранная шашка и клик по доступному ходу
            const move = validMoves.find(m => m.to.row === row && m.to.col === col);
            if (move) {
                makeMove(move);
                return;
            }
            
            // Выбор шашки
            const piece = board[row][col];
            if (piece && piece.color === playerColor) {
                selectedCell = { row, col };
                validMoves = getValidMoves(row, col);
                
                if (validMoves.length === 0) {
                    document.getElementById('info').textContent = 'Нет доступных ходов для этой шашки';
                } else if (validMoves[0].captures.length > 0) {
                    document.getElementById('info').textContent = 'Обязательное взятие! Выберите красную клетку';
                } else {
                    document.getElementById('info').textContent = 'Выберите зеленую клетку для хода';
                }
            } else {
                // Отмена выбора
                selectedCell = null;
                validMoves = [];
                document.getElementById('info').textContent = 'Нажмите на свою шашку';
            }
            
            renderBoard();
        }
        
        // Выполнение хода
        function makeMove(move) {
            const piece = board[move.from.row][move.from.col];
            board[move.to.row][move.to.col] = piece;
            board[move.from.row][move.from.col] = null;
            
            move.captures.forEach(capture => {
                board[capture.row][capture.col] = null;
            });
            
            if ((piece.color === 'white' && move.to.row === 0) ||
                (piece.color === 'black' && move.to.row === 7)) {
                piece.isKing = true;
            }
            
            selectedCell = null;
            validMoves = [];
            
            // Проверка победы
            if (checkWin()) {
                gameOver = true;
                document.getElementById('info').textContent = 'Игра окончена!';
                renderBoard();
                
                tg.sendData(JSON.stringify({
                    action: 'game_over',
                    winner: currentPlayer === 'white' ? 'player' : 'ai'
                }));
                return;
            }
            
            // Смена хода
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            renderBoard();
            
            // Ход ИИ
            if (currentPlayer === aiColor && !gameOver) {
                isAIThinking = true;
                document.getElementById('info').textContent = 'ИИ думает...';
                setTimeout(() => {
                    aiMove();
                    isAIThinking = false;
                }, 500);
            }
        }
        
        // Ход ИИ
        function aiMove() {
            if (gameOver) return;
            
            const aiMoves = getAllMoves(aiColor);
            
            if (aiMoves.length === 0) {
                // ИИ не может ходить - победа игрока
                gameOver = true;
                currentPlayer = playerColor;
                document.getElementById('info').textContent = 'ИИ не может ходить! Вы победили!';
                renderBoard();
                return;
            }
            
            // Приоритет взятия
            const captureMoves = aiMoves.filter(m => m.captures.length > 0);
            const availableMoves = captureMoves.length > 0 ? captureMoves : aiMoves;
            
            // Выбор лучшего хода (простая эвристика)
            let bestMove = availableMoves[0];
            let bestScore = -Infinity;
            
            for (const move of availableMoves) {
                let score = 0;
                
                // За взятие даем очки
                score += move.captures.length * 10;
                
                // За превращение в дамку
                if (move.to.row === 7) score += 5;
                
                // За продвижение вперед
                score += move.to.row - move.from.row;
                
                // За безопасность (не под боем)
                if (!isUnderAttack(move.to.row, move.to.col, aiColor)) {
                    score += 3;
                }
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            
            makeMove(bestMove);
        }
        
        // Проверка, находится ли клетка под боем
        function isUnderAttack(row, col, color) {
            const enemyColor = color === 'white' ? 'black' : 'white';
            
            for (const dr of [-1, 1]) {
                for (const dc of [-1, 1]) {
                    const attackRow = row + dr;
                    const attackCol = col + dc;
                    const landRow = row + dr * 2;
                    const landCol = col + dc * 2;
                    
                    if (isValid(attackRow, attackCol) && 
                        isValid(landRow, landCol) &&
                        board[attackRow][attackCol] && 
                        board[attackRow][attackCol].color === enemyColor &&
                        !board[landRow][landCol]) {
                        return true;
                    }
                }
            }
            return false;
        }
        
        // Проверка победы
        function checkWin() {
            const whitePieces = board.flat().filter(p => p && p.color === 'white').length;
            const blackPieces = board.flat().filter(p => p && p.color === 'black').length;
            
            if (whitePieces === 0 || blackPieces === 0) {
                return true;
            }
            
            // Проверка на отсутствие ходов
            const currentMoves = getAllMoves(currentPlayer);
            return currentMoves.length === 0;
        }
        
        // Новая игра
        function newGame() {
            initBoard();
            selectedCell = null;
            validMoves = [];
            currentPlayer = 'white';
            gameOver = false;
            isAIThinking = false;
            document.getElementById('info').textContent = 'Новая игра! Вы ходите первыми';
            renderBoard();
        }
        
        // Закрытие
        function closeGame() {
            tg.close();
        }
        
        // Запуск
        initBoard();
        renderBoard();
    </script>
</body>
</html>
