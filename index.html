<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шашки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1a1a2e 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding: 10px;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .background-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px;
            flex: 1;
            text-align: center;
            transition: all 0.3s;
        }
        
        .player-card.active {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .player-avatar.white {
            background: linear-gradient(135deg, #ffffff, #cccccc);
            color: #333;
        }
        
        .player-avatar.black {
            background: linear-gradient(135deg, #444, #000);
            color: white;
            border: 2px solid #666;
        }
        
        .player-name {
            font-size: 12px;
            font-weight: 600;
        }
        
        .player-score {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .board-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, #deb887, #c19a6b);
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 2px 10px rgba(255,255,255,0.3);
            margin: 0 auto;
            animation: zoomIn 0.5s ease;
            position: relative;
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            gap: 0;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: none;
        }
        
        .cell-dark {
            background: linear-gradient(145deg, #8b4513, #6b3410);
        }
        
        .cell-light {
            background: linear-gradient(145deg, #f4d03f, #e0b830);
        }
        
        .cell-selected {
            background: linear-gradient(145deg, #ffd700, #ffb700) !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .cell-valid::after {
            content: '';
            width: 30%;
            height: 30%;
            background: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            position: absolute;
            animation: pulse 1s infinite;
        }
        
        .cell-capture::after {
            content: '';
            width: 40%;
            height: 40%;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            position: absolute;
            animation: pulse 0.5s infinite;
        }
        
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            pointer-events: none;
            animation: pieceAppear 0.3s ease;
        }
        
        @keyframes pieceAppear {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        .piece-white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border: 2px solid #999;
        }
        
        .piece-black {
            background: radial-gradient(circle at 30% 30%, #555555, #000000);
            border: 2px solid #333;
        }
        
        .piece-king {
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7), inset 0 2px 4px rgba(255,255,255,0.3);
            animation: kingAppear 0.5s ease;
        }
        
        @keyframes kingAppear {
            0% { transform: scale(0); box-shadow: 0 0 0 rgba(255, 215, 0, 0); }
            50% { transform: scale(1.3); box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
        }
        
        .piece-king::after {
            content: '♛';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        
        .game-info {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            gap: 10px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffd700;
        }
        
        .stat-label {
            font-size: 10px;
            opacity: 0.8;
            text-transform: uppercase;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        
        .btn {
            background: linear-gradient(145deg, #ffd700, #ffb700);
            color: #1a1a1a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            min-width: 100px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-secondary {
            background: linear-gradient(145deg, #444, #333);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            animation: modalIn 0.5s ease;
            display: none;
        }
        
        @keyframes modalIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }
        
        .modal h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .modal p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .achievement {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(145deg, #ffd700, #ffb700);
            color: #1a1a1a;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1001;
            animation: achievementIn 0.5s ease;
            display: none;
        }
        
        @keyframes achievementIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.8); opacity: 0.5; }
        }
        
        @keyframes multiCapture {
            0% { transform: scale(1); }
            25% { transform: scale(1.2); box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
            50% { transform: scale(1.1); box-shadow: 0 0 50px rgba(255, 100, 0, 0.9); }
            75% { transform: scale(1.15); box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
            100% { transform: scale(1); }
        }
        
        @keyframes captureFlash {
            0% { background: rgba(255, 0, 0, 0.8); }
            50% { background: rgba(255, 100, 0, 0.9); }
            100% { background: rgba(255, 0, 0, 0); }
        }
        
        .cell-multi-capture {
            animation: captureFlash 0.6s ease;
        }
        
        .piece-captured {
            animation: pieceDisappear 0.5s ease forwards;
        }
        
        @keyframes pieceDisappear {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="background-particles" id="particles"></div>
    
    <div class="header">
        <h1>♟ Шашки</h1>
        
        <div class="player-info">
            <div class="player-card active" id="playerCard">
                <div class="player-avatar white">👤</div>
                <div class="player-name">Вы</div>
                <div class="player-score" id="playerScore">12 шашек</div>
            </div>
            
            <div class="player-card" id="aiCard">
                <div class="player-avatar black">🤖</div>
                <div class="player-name">ИИ</div>
                <div class="player-score" id="aiScore">12 шашек</div>
            </div>
        </div>
    </div>
    
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    
    <div class="game-info">
        <div class="stat-box">
            <div class="stat-value" id="moveCount">0</div>
            <div class="stat-label">Ходов</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="captureCount">0</div>
            <div class="stat-label">Взятий</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="timer">00:00</div>
            <div class="stat-label">Время</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="newGame()">🔄 Новая игра</button>
        <button class="btn btn-secondary" onclick="closeGame()">✖ Закрыть</button>
    </div>
    
    <div class="modal" id="modal">
        <h2 id="modalTitle">🏆 Победа!</h2>
        <p id="modalText">Вы выиграли!</p>
        <button class="btn" onclick="hideModal()">Играть снова</button>
    </div>
    
    <div class="achievement" id="achievement"></div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let board = [];
        let selectedCell = null;
        let validMoves = [];
        let currentPlayer = 'white';
        let gameOver = false;
        let isAIThinking = false;
        const playerColor = 'white';
        const aiColor = 'black';
        
        let moveCount = 0;
        let captureCount = 0;
        let timerInterval;
        let seconds = 0;
        
        const achievements = {
            firstCapture: { name: 'Первое взятие', emoji: '⚔️', unlocked: false },
            tripleCapture: { name: 'Тройное взятие', emoji: '🔥', unlocked: false },
            firstKing: { name: 'Первая дамка', emoji: '👑', unlocked: false },
            winNoLoss: { name: 'Без потерь', emoji: '🛡️', unlocked: false },
            quickWin: { name: 'Быстрая победа', emoji: '⚡', unlocked: false }
        };
        
        let audioContext;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            try {
                initAudio();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'move':
                        oscillator.frequency.value = 400;
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                    case 'capture':
                        oscillator.frequency.value = 200;
                        gainNode.gain.value = 0.5;
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.2);
                        break;
                    case 'multiCapture':
                        oscillator.frequency.value = 300;
                        gainNode.gain.value = 0.6;
                        oscillator.start();
                        setTimeout(() => {
                            oscillator.frequency.value = 500;
                        }, 100);
                        setTimeout(() => {
                            oscillator.frequency.value = 700;
                        }, 200);
                        oscillator.stop(audioContext.currentTime + 0.4);
                        break;
                    case 'king':
                        oscillator.frequency.value = 600;
                        gainNode.gain.value = 0.4;
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                    case 'win':
                        oscillator.frequency.value = 800;
                        gainNode.gain.value = 0.5;
                        oscillator.start();
                        setTimeout(() => {
                            oscillator.frequency.value = 1000;
                        }, 100);
                        oscillator.stop(audioContext.currentTime + 0.5);
                        break;
                }
            } catch(e) {
                console.log('Audio not available');
            }
        }
        
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(particle);
            }
        }
        
        function showAchievement(name, emoji) {
            const achievementElement = document.getElementById('achievement');
            achievementElement.innerHTML = `${emoji} ${name}`;
            achievementElement.style.display = 'block';
            setTimeout(() => {
                achievementElement.style.display = 'none';
            }, 3000);
        }
        
        function checkAchievements(type, data) {
            if (type === 'capture') {
                if (!achievements.firstCapture.unlocked) {
                    achievements.firstCapture.unlocked = true;
                    showAchievement(achievements.firstCapture.name, achievements.firstCapture.emoji);
                }
                if (data >= 3 && !achievements.tripleCapture.unlocked) {
                    achievements.tripleCapture.unlocked = true;
                    showAchievement(achievements.tripleCapture.name, achievements.tripleCapture.emoji);
                }
            }
            if (type === 'king' && !achievements.firstKing.unlocked) {
                achievements.firstKing.unlocked = true;
                showAchievement(achievements.firstKing.name, achievements.firstKing.emoji);
            }
            if (type === 'win' && data === 0 && !achievements.winNoLoss.unlocked) {
                achievements.winNoLoss.unlocked = true;
                showAchievement(achievements.winNoLoss.name, achievements.winNoLoss.emoji);
            }
            if (type === 'win' && moveCount < 20 && !achievements.quickWin.unlocked) {
                achievements.quickWin.unlocked = true;
                showAchievement(achievements.quickWin.name, achievements.quickWin.emoji);
            }
        }
        
        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        if (row < 3) {
                            board[row][col] = { color: 'black', isKing: false };
                        } else if (row > 4) {
                            board[row][col] = { color: 'white', isKing: false };
                        }
                    }
                }
            }
        }
        
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    
                    if ((row + col) % 2 === 0) {
                        cell.className = 'cell cell-light';
                    } else {
                        cell.className = 'cell cell-dark';
                    }
                    
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                        cell.classList.add('cell-selected');
                    }
                    
                    validMoves.forEach(move => {
                        if (move.to.row === row && move.to.col === col) {
                            if (move.captures.length > 0) {
                                cell.classList.add('cell-capture');
                            } else {
                                cell.classList.add('cell-valid');
                            }
                        }
                    });
                    
                    if (board[row][col]) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        
                        if (board[row][col].color === 'white') {
                            piece.classList.add('piece-white');
                        } else {
                            piece.classList.add('piece-black');
                        }
                        
                        if (board[row][col].isKing) {
                            piece.classList.add('piece-king');
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    cell.addEventListener('click', () => onCellClick(row, col));
                    cell.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        onCellClick(row, col);
                    });
                    
                    boardElement.appendChild(cell);
                }
            }
            
            updateStats();
        }
        
        function updateStats() {
            document.getElementById('moveCount').textContent = moveCount;
            document.getElementById('captureCount').textContent = captureCount;
            
            const whitePieces = board.flat().filter(p => p && p.color === 'white').length;
            const blackPieces = board.flat().filter(p => p && p.color === 'black').length;
            
            document.getElementById('playerScore').textContent = whitePieces + ' шашек';
            document.getElementById('aiScore').textContent = blackPieces + ' шашек';
            
            document.getElementById('playerCard').className = 'player-card' + (currentPlayer === 'white' ? ' active' : '');
            document.getElementById('aiCard').className = 'player-card' + (currentPlayer === 'black' ? ' active' : '');
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                document.getElementById('timer').textContent = 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(remainingSeconds).padStart(2, '0');
            }, 1000);
        }
        
        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').style.display = 'block';
        }
        
        function hideModal() {
            document.getElementById('modal').style.display = 'none';
            newGame();
        }
        
        function getAllCaptures(color) {
            const captures = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] && board[row][col].color === color) {
                        const pieceCaptures = getCaptureMoves(row, col);
                        captures.push(...pieceCaptures);
                    }
                }
            }
            return captures;
        }
        
        function getCaptureMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];
            
            const moves = [];
            
            if (piece.isKing) {
                const directions = [
                    { dr: -1, dc: -1 },
                    { dr: -1, dc: 1 },
                    { dr: 1, dc: -1 },
                    { dr: 1, dc: 1 }
                ];
                
                for (const dir of directions) {
                    let captureRow = row + dir.dr;
                    let captureCol = col + dir.dc;
                    
                    while (isValid(captureRow, captureCol) && !board[captureRow][captureCol]) {
                        captureRow += dir.dr;
                        captureCol += dir.dc;
                    }
                    
                    if (isValid(captureRow, captureCol) && 
                        board[captureRow][captureCol] && 
                        board[captureRow][captureCol].color !== piece.color) {
                        
                        let landRow = captureRow + dir.dr;
                        let landCol = captureCol + dir.dc;
                        
                        while (isValid(landRow, landCol) && !board[landRow][landCol]) {
                            const move = {
                                from: { row, col },
                                to: { row: landRow, col: landCol },
                                captures: [{ row: captureRow, col: captureCol }],
                                piece: piece
                            };
                            
                            const multiCaptures = findMultiCaptures(move, piece);
                            moves.push(...multiCaptures);
                            
                            landRow += dir.dr;
                            landCol += dir.dc;
                        }
                    }
                }
            } else {
                const directions = [-1, 1];
                
                for (const dr of directions) {
                    for (const dc of directions) {
                        const captureRow = row + dr;
                        const captureCol = col + dc;
                        const landRow = row + dr * 2;
                        const landCol = col + dc * 2;
                        
                        if (isValid(captureRow, captureCol) && 
                            isValid(landRow, landCol) &&
                            board[captureRow][captureCol] && 
                            board[captureRow][captureCol].color !== piece.color &&
                            !board[landRow][landCol]) {
                            
                            const move = {
                                from: { row, col },
                                to: { row: landRow, col: landCol },
                                captures: [{ row: captureRow, col: captureCol }],
                                piece: piece
                            };
                            
                            const multiCaptures = findMultiCaptures(move, piece);
                            moves.push(...multiCaptures);
                        }
                    }
                }
            }
            
            return moves;
        }
        
        function findMultiCaptures(move, originalPiece) {
            const results = [move];
            const lastPos = move.to;
            const capturedSet = new Set(move.captures.map(c => `${c.row},${c.col}`));
            
            const tempBoard = board.map(row => [...row]);
            const piece = { ...originalPiece };
            
            tempBoard[move.to.row][move.to.col] = piece;
            tempBoard[move.from.row][move.from.col] = null;
            move.captures.forEach(capture => {
                tempBoard[capture.row][capture.col] = null;
            });
            
            if ((piece.color === 'white' && move.to.row === 0) ||
                (piece.color === 'black' && move.to.row === 7)) {
                piece.isKing = true;
            }
            
            if (piece.isKing) {
                const directions = [
                    { dr: -1, dc: -1 },
                    { dr: -1, dc: 1 },
                    { dr: 1, dc: -1 },
                    { dr: 1, dc: 1 }
                ];
                
                for (const dir of directions) {
                    let captureRow = lastPos.row + dir.dr;
                    let captureCol = lastPos.col + dir.dc;
                    
                    while (isValid(captureRow, captureCol) && !tempBoard[captureRow][captureCol]) {
                        captureRow += dir.dr;
                        captureCol += dir.dc;
                    }
                    
                    if (isValid(captureRow, captureCol) && 
                        tempBoard[captureRow][captureCol] && 
                        tempBoard[captureRow][captureCol].color !== piece.color) {
                        
                        let landRow = captureRow + dir.dr;
                        let landCol = captureCol + dir.dc;
                        
                        while (isValid(landRow, landCol) && !tempBoard[landRow][landCol]) {
                            if (!capturedSet.has(`${captureRow},${captureCol}`)) {
                                const extendedMove = {
                                    from: move.from,
                                    to: { row: landRow, col: landCol },
                                    captures: [...move.captures, { row: captureRow, col: captureCol }],
                                    piece: originalPiece
                                };
                                
                                results.push(...findMultiCaptures(extendedMove, originalPiece));
                            }
                            
                            landRow += dir.dr;
                            landCol += dir.dc;
                        }
                    }
                }
            } else {
                const directions = [-1, 1];
                
                for (const dr of directions) {
                    for (const dc of directions) {
                        const captureRow = lastPos.row + dr;
                        const captureCol = lastPos.col + dc;
                        const landRow = lastPos.row + dr * 2;
                        const landCol = lastPos.col + dc * 2;
                        
                        if (isValid(captureRow, captureCol) && 
                            isValid(landRow, landCol) &&
                            tempBoard[captureRow][captureCol] && 
                            tempBoard[captureRow][captureCol].color !== piece.color &&
                            !tempBoard[landRow][landCol] &&
                            !capturedSet.has(`${captureRow},${captureCol}`)) {
                            
                            const extendedMove = {
                                from: move.from,
                                to: { row: landRow, col: landCol },
                                captures: [...move.captures, { row: captureRow, col: captureCol }],
                                piece: originalPiece
                            };
                            
                            results.push(...findMultiCaptures(extendedMove, originalPiece));
                        }
                    }
                }
            }
            
            return results;
        }
        
        function getNormalMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];
            
            const moves = [];
            
            if (piece.isKing) {
                const directions = [
                    { dr: -1, dc: -1 },
                    { dr: -1, dc: 1 },
                    { dr: 1, dc: -1 },
                    { dr: 1, dc: 1 }
                ];
                
                for (const dir of directions) {
                    let newRow = row + dir.dr;
                    let newCol = col + dir.dc;
                    
                    while (isValid(newRow, newCol) && !board[newRow][newCol]) {
                        moves.push({
                            from: { row, col },
                            to: { row: newRow, col: newCol },
                            captures: []
                        });
                        
                        newRow += dir.dr;
                        newCol += dir.dc;
                    }
                }
            } else {
                const directions = piece.color === 'white' ? [-1] : [1];
                
                for (const dr of directions) {
                    for (const dc of [-1, 1]) {
                        const newRow = row + dr;
                        const newCol = col + dc;
                        
                        if (isValid(newRow, newCol) && !board[newRow][newCol]) {
                            moves.push({
                                from: { row, col },
                                to: { row: newRow, col: newCol },
                                captures: []
                            });
                        }
                    }
                }
            }
            
            return moves;
        }
        
        function getAllMoves(color) {
            const allCaptures = getAllCaptures(color);
            if (allCaptures.length > 0) {
                return allCaptures;
            }
            
            const normalMoves = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] && board[row][col].color === color) {
                        normalMoves.push(...getNormalMoves(row, col));
                    }
                }
            }
            return normalMoves;
        }
        
        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece || piece.color !== currentPlayer) return [];
            
            const allCaptures = getAllCaptures(currentPlayer);
            if (allCaptures.length > 0) {
                return getCaptureMoves(row, col);
            }
            
            return getNormalMoves(row, col);
        }
        
        function isValid(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }
        
        function onCellClick(row, col) {
            if (gameOver || isAIThinking || currentPlayer !== playerColor) return;
            
            const move = validMoves.find(m => m.to.row === row && m.to.col === col);
            if (move) {
                makeMove(move);
                return;
            }
            
            const piece = board[row][col];
            if (piece && piece.color === playerColor) {
                selectedCell = { row, col };
                validMoves = getValidMoves(row, col);
            } else {
                selectedCell = null;
                validMoves = [];
            }
            
            renderBoard();
        }
        
        function makeMove(move) {
            const piece = board[move.from.row][move.from.col];
            
            board[move.to.row][move.to.col] = piece;
            board[move.from.row][move.from.col] = null;
            
            if (move.captures.length > 1) {
                move.captures.forEach((capture) => {
                    const cell = document.querySelector(`[data-row="${capture.row}"][data-col="${capture.col}"]`);
                    if (cell) {
                        const capturedPiece = cell.querySelector('.piece');
                        if (capturedPiece) {
                            capturedPiece.classList.add('piece-captured');
                        }
                        cell.classList.add('cell-multi-capture');
                    }
                });
                
                const pieceCell = document.querySelector(`[data-row="${move.to.row}"][data-col="${move.to.col}"]`);
                if (pieceCell) {
                    const movingPiece = pieceCell.querySelector('.piece');
                    if (movingPiece) {
                        movingPiece.style.animation = 'multiCapture 0.6s ease';
                    }
                }
                
                playSound('multiCapture');
            }
            
            setTimeout(() => {
                move.captures.forEach(capture => {
                    board[capture.row][capture.col] = null;
                    captureCount++;
                });
                
                if (move.captures.length > 0) {
                    checkAchievements('capture', move.captures.length);
                } else {
                    playSound('move');
                }
                
                if ((piece.color === 'white' && move.to.row === 0) ||
                    (piece.color === 'black' && move.to.row === 7)) {
                    piece.isKing = true;
                    playSound('king');
                    checkAchievements('king');
                }
                
                moveCount++;
                selectedCell = null;
                validMoves = [];
                
                const whitePieces = board.flat().filter(p => p && p.color === 'white').length;
                const blackPieces = board.flat().filter(p => p && p.color === 'black').length;
                
                if (whitePieces === 0 || blackPieces === 0) {
                    gameOver = true;
                    const winner = whitePieces > 0 ? 'white' : 'black';
                    currentPlayer = winner;
                    playSound('win');
                    checkAchievements('win', captureCount);
                    showModal(
                        winner === 'white' ? '🏆 Победа!' : '😔 Поражение',
                        winner === 'white' ? `Вы выиграли за ${moveCount} ходов!` : 'ИИ победил!'
                    );
                    clearInterval(timerInterval);
                    updateStats();
                    return;
                }
                
                currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                
                const currentMoves = getAllMoves(currentPlayer);
                if (currentMoves.length === 0) {
                    gameOver = true;
                    const winner = currentPlayer === 'white' ? 'black' : 'white';
                    currentPlayer = winner;
                    playSound('win');
                    checkAchievements('win', captureCount);
                    showModal(
                        winner === 'white' ? '🏆 Победа!' : '😔 Поражение',
                        'Противник не может ходить!'
                    );
                    clearInterval(timerInterval);
                    updateStats();
                    return;
                }
                
                updateStats();
                renderBoard();
                
                if (currentPlayer === aiColor && !gameOver) {
                    isAIThinking = true;
                    setTimeout(() => {
                        aiMove();
                        isAIThinking = false;
                    }, 500);
                }
            }, move.captures.length > 1 ? 600 : 0);
        }
        
        function aiMove() {
            if (gameOver) return;
            
            const aiMoves = getAllMoves(aiColor);
            
            if (aiMoves.length === 0) {
                gameOver = true;
                currentPlayer = playerColor;
                playSound('win');
                checkAchievements('win', captureCount);
                showModal('🏆 Победа!', 'ИИ не может ходить!');
                clearInterval(timerInterval);
                updateStats();
                return;
            }
            
            const captureMoves = aiMoves.filter(m => m.captures.length > 0);
            const availableMoves = captureMoves.length > 0 ? captureMoves : aiMoves;
            
            let bestMove = availableMoves[0];
            let bestScore = -Infinity;
            
            for (const move of availableMoves) {
                let score = 0;
                score += move.captures.length * 20;
                if (move.to.row === 7) score += 15;
                score += move.to.row - move.from.row;
                if (move.captures.length > 1) {
                    score += move.captures.length * 10;
                }
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            
            makeMove(bestMove);
        }
        
        function newGame() {
            if (timerInterval) clearInterval(timerInterval);
            isAIThinking = false;
            
            initBoard();
            selectedCell = null;
            validMoves = [];
            currentPlayer = 'white';
            gameOver = false;
            moveCount = 0;
            captureCount = 0;
            seconds = 0;
            
            document.getElementById('modal').style.display = 'none';
            
            startTimer();
            renderBoard();
            updateStats();
        }
        
        function closeGame() {
            tg.close();
        }
        
        createParticles();
        initBoard();
        renderBoard();
        updateStats();
        startTimer();
    </script>
</body>
