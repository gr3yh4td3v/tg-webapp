<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Строчки - одиночки 🕯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 22px; margin-bottom: 16px; background: linear-gradient(135deg, #feca57, #ff9ff3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        
        .card {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 3/4;
            padding: 40px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 16px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .card-text { font-size: 26px; line-height: 1.5; margin-bottom: 16px; word-break: break-word; font-style: italic; font-family: Georgia, serif; }
        .card-text::before { content: '«'; }
        .card-text::after { content: '»'; }
        .card-divider { width: 40px; height: 2px; background: currentColor; opacity: 0.4; margin-bottom: 16px; }
        .card-author { font-size: 14px; opacity: 0.7; }
        .card-channel { margin-top: 30px; font-size: 11px; opacity: 0.4; }
        
        textarea {
            width: 100%; max-width: 360px; padding: 14px; border-radius: 14px;
            border: 1px solid #2a2a3e; background: #1a1a2e; color: #e0e0e0;
            font-size: 16px; resize: vertical; min-height: 100px; margin-bottom: 12px;
        }
        textarea:focus { outline: none; border-color: #feca57; }
        textarea::placeholder { color: #555; }
        
        .options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; max-width: 360px; }
        .opt {
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .opt.active { border-color: #feca57; transform: scale(1.1); }
        
        .bg1 { background: linear-gradient(160deg, #1a0a2e, #c94b4b, #f0a050); color: #fff; }
        .bg2 { background: linear-gradient(160deg, #0a0a1a, #1a1a3e, #2d1b69); color: #c8c8e8; }
        .bg3 { background: linear-gradient(160deg, #0c1b33, #26547c, #4299e1); color: #e0f0ff; }
        .bg4 { background: linear-gradient(160deg, #0d1f0d, #2d5a2d, #4a7c4a); color: #d8f0d8; }
        .bg5 { background: linear-gradient(160deg, #2d0a1a, #8b5a6a, #c4909a); color: #ffe0e8; }
        .bg6 { background: linear-gradient(160deg, #050505, #1a1a1a, #252525); color: #ccc; }
        .bg7 { background: linear-gradient(160deg, #e8e8e8, #fafafa, #fff); color: #1a1a1a; }
        .bg8 { background: linear-gradient(160deg, #1a0f00, #8b6914, #d4af37); color: #fff8e0; }

        button {
            width: 100%; max-width: 360px; padding: 16px; border: none; border-radius: 14px;
            font-size: 16px; cursor: pointer; font-weight: 600; margin-bottom: 8px;
            background: linear-gradient(135deg, #feca57, #ff9ff3); color: #1a1a2e;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.97); }
        
        .status {
            text-align: center; color: #888; font-size: 13px; margin-top: 8px;
            min-height: 20px; max-width: 360px;
        }
    </style>
</head>
<body>
    <h1>🕯 Строчки - одиночки</h1>
    
    <div class="card bg1" id="card">
        <div class="card-text" id="cardText">Напиши свою строчку...</div>
        <div class="card-divider"></div>
        <div class="card-author" id="cardAuthor">— Автор</div>
        <div class="card-channel">Строчки - одиночки 🕯</div>
    </div>
    
    <textarea id="textInput" placeholder="О чём твоя строчка? Пиши..." maxlength="350" rows="3"></textarea>
    
    <div class="options">
        <div class="opt bg1 active" onclick="setBg('bg1', this)"></div>
        <div class="opt bg2" onclick="setBg('bg2', this)"></div>
        <div class="opt bg3" onclick="setBg('bg3', this)"></div>
        <div class="opt bg4" onclick="setBg('bg4', this)"></div>
        <div class="opt bg5" onclick="setBg('bg5', this)"></div>
        <div class="opt bg6" onclick="setBg('bg6', this)"></div>
        <div class="opt bg7" onclick="setBg('bg7', this)"></div>
        <div class="opt bg8" onclick="setBg('bg8', this)"></div>
    </div>
    
    <button id="saveBtn">💾 Сохранить картинку</button>
    <div class="status" id="status"></div>

    <script>
        const card = document.getElementById('card');
        const cardText = document.getElementById('cardText');
        const cardAuthor = document.getElementById('cardAuthor');
        const textInput = document.getElementById('textInput');
        const status = document.getElementById('status');
        
        const allBg = ['bg1','bg2','bg3','bg4','bg5','bg6','bg7','bg8'];
        
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            const user = tg.initDataUnsafe?.user;
            cardAuthor.textContent = `— ${user?.first_name || 'Автор'}`;
            tg.ready();
        }
        
        textInput.addEventListener('input', () => {
            cardText.textContent = textInput.value || 'Напиши свою строчку...';
        });
        
        function setBg(bg, el) {
            document.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            allBg.forEach(b => card.classList.remove(b));
            card.classList.add(bg);
        }

        // Загружаем html2canvas
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                status.textContent = 'Напиши строчку ✏️';
                return;
            }

            status.textContent = 'Загружаю...';
            
            try {
                // Загружаем html2canvas
                if (typeof html2canvas === 'undefined') {
                    await loadScript('https://html2canvas.hertzen.com/dist/html2canvas.min.js');
                }
                
                status.textContent = 'Создаю картинку...';
                
                const canvas = await html2canvas(card, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                    allowTaint: true
                });
                
                // Конвертируем в blob и скачиваем
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `strochka_${Date.now()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    status.textContent = '✅ Сохранено! Отправь админу';
                    setTimeout(() => { status.textContent = ''; }, 3000);
                }, 'image/png');
                
            } catch (err) {
                console.error(err);
                status.textContent = '❌ Ошибка. Попробуй ещё раз';
            }
        });
    </script>
</body>
</html>
