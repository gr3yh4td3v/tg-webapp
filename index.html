<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шашки - Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .player-name {
            font-size: 14px;
            font-weight: bold;
        }
        
        .player-status {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .board-container {
            position: relative;
            background: #deb887;
            border-radius: 10px;
            padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(80vw, 500px);
            height: min(80vw, 500px);
            gap: 0;
            position: relative;
        }
        
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .cell.dark {
            background: #8b4513;
        }
        
        .cell.light {
            background: #f4d03f;
        }
        
        .cell.valid-move {
            cursor: pointer;
        }
        
        .cell.valid-move::after {
            content: '';
            width: 30%;
            height: 30%;
            background: rgba(0, 255, 0, 0.5);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        .cell.selected {
            box-shadow: inset 0 0 0 3px #ffd700;
            animation: glow 1.5s infinite;
        }
        
        .cell.last-move {
            background: #ffa500;
        }
        
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .piece.white {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border: 2px solid #cccccc;
        }
        
        .piece.black {
            background: linear-gradient(135deg, #333333 0%, #000000 100%);
            border: 2px solid #666666;
        }
        
        .piece.king {
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .piece.king::after {
            content: '♛';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ffd700;
        }
        
        .piece:hover {
            transform: scale(1.1);
            z-index: 2;
        }
        
        .piece.selected {
            animation: bounce 0.5s infinite;
            z-index: 3;
        }
        
        .game-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        
        .turn-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        .turn-dot.white {
            background: white;
        }
        
        .turn-dot.black {
            background: black;
            border: 2px solid white;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            z-index: 10;
            animation: slideIn 0.5s ease;
        }
        
        .game-over h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: inset 0 0 0 3px #ffd700; }
            50% { box-shadow: inset 0 0 0 5px #ffd700, 0 0 20px #ffd700; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes slideIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar">P1</div>
                <div>
                    <div class="player-name">Игрок 1</div>
                    <div class="player-status">Белые</div>
                </div>
            </div>
            <div class="player-info">
                <div>
                    <div class="player-name">Игрок 2</div>
                    <div class="player-status">Черные</div>
                </div>
                <div class="player-avatar">P2</div>
            </div>
        </div>
        
        <div class="board-container">
            <div id="board"></div>
        </div>
        
        <div class="game-info">
            <div class="turn-indicator">
                <div>Ход:</div>
                <div class="turn-dot white" id="turnDot"></div>
            </div>
            <div>Счет: <span id="score">0 - 0</span></div>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setBackgroundColor('#1e3c72');
        
        // Получение параметров из URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game_id');
        const playerNumber = parseInt(urlParams.get('player'));
        const isBotGame = urlParams.get('bot') === 'true';
        
        // Состояние игры
        let board = [];
        let selectedPiece = null;
        let validMoves = [];
        let currentPlayer = 'white'; // белые ходят первыми
        let playerColor = playerNumber === 1 ? 'white' : 'black';
        let moveHistory = [];
        let capturedPieces = { white: 0, black: 0 };
        let isGameOver = false;
        
        // Инициализация доски
        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            
            // Расстановка шашек
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) { // темные клетки
                        if (row < 3) {
                            board[row][col] = { color: 'black', isKing: false };
                        } else if (row > 4) {
                            board[row][col] = { color: 'white', isKing: false };
                        }
                    }
                }
            }
        }
        
        // Отрисовка доски
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // Подсветка последнего хода
                    if (moveHistory.length > 0) {
                        const lastMove = moveHistory[moveHistory.length - 1];
                        if ((lastMove.from.row === row && lastMove.from.col === col) ||
                            (lastMove.to.row === row && lastMove.to.col === col)) {
                            cell.classList.add('last-move');
                        }
                    }
                    
                    // Подсветка выбранной шашки
                    if (selectedPiece && 
                        selectedPiece.row === row && 
                        selectedPiece.col === col) {
                        cell.classList.add('selected');
                    }
                    
                    // Подсветка доступных ходов
                    if (validMoves.some(move => move.to.row === row && move.to.col === col)) {
                        cell.classList.add('valid-move');
                    }
                    
                    // Добавление шашки
                    if (board[row][col]) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[row][col].color}`;
                        if (board[row][col].isKing) {
                            piece.classList.add('king');
                        }
                        if (selectedPiece && 
                            selectedPiece.row === row && 
                            selectedPiece.col === col) {
                            piece.classList.add('selected');
                        }
                        piece.addEventListener('click', () => onPieceClick(row, col));
                        cell.appendChild(piece);
                    }
                    
                    cell.addEventListener('click', () => onCellClick(row, col));
                    boardElement.appendChild(cell);
                }
            }
            
            updateTurnIndicator();
        }
        
        // Получение возможных ходов для шашки
        function getValidMoves(row, col) {
            const piece = board[row][col];
            if (!piece || piece.color !== currentPlayer) return [];
            
            const moves = [];
            const directions = piece.isKing ? [-1, 1] : (piece.color === 'white' ? [-1] : [1]);
            const captureDirections = [-1, 1];
            
            // Проверка обычных ходов
            for (const dr of directions) {
                for (const dc of captureDirections) {
                    const newRow = row + dr;
                    const newCol = col + dc;
                    
                    if (isValidPosition(newRow, newCol) && !board[newRow][newCol]) {
                        moves.push({
                            from: { row, col },
                            to: { row: newRow, col: newCol },
                            captures: []
                        });
                    }
                }
            }
            
            // Проверка взятия
            for (const dr of captureDirections) {
                for (const dc of captureDirections) {
                    const captureRow = row + dr;
                    const captureCol = col + dc;
                    const landRow = row + dr * 2;
                    const landCol = col + dc * 2;
                    
                    if (isValidPosition(captureRow, captureCol) && 
                        isValidPosition(landRow, landCol) &&
                        board[captureRow][captureCol] && 
                        board[captureRow][captureCol].color !== piece.color &&
                        !board[landRow][landCol]) {
                        
                        moves.push({
                            from: { row, col },
                            to: { row: landRow, col: landCol },
                            captures: [{ row: captureRow, col: captureCol }]
                        });
                    }
                }
            }
            
            return moves;
        }
        
        // Проверка позиции
        function isValidPosition(row, col) {
            return row >= 0 && row < 8 && col >= 0 && col < 8;
        }
        
        // Обработка клика по шашке
        function onPieceClick(row, col) {
            if (isGameOver || currentPlayer !== playerColor) return;
            
            const piece = board[row][col];
            if (piece && piece.color === playerColor) {
                selectedPiece = { row, col };
                validMoves = getValidMoves(row, col);
                renderBoard();
            }
        }
        
        // Обработка клика по клетке
        function onCellClick(row, col) {
            if (isGameOver || currentPlayer !== playerColor) return;
            
            // Если есть выбранная шашка и клик по доступному ходу
            const move = validMoves.find(m => m.to.row === row && m.to.col === col);
            if (move) {
                makeMove(move);
            } else {
                // Отмена выбора
                selectedPiece = null;
                validMoves = [];
                renderBoard();
            }
        }
        
        // Выполнение хода
        function makeMove(move) {
            // Перемещение шашки
            const piece = board[move.from.row][move.from.col];
            board[move.to.row][move.to.col] = piece;
            board[move.from.row][move.from.col] = null;
            
            // Взятие шашек
            move.captures.forEach(capture => {
                const capturedPiece = board[capture.row][capture.col];
                if (capturedPiece) {
                    capturedPieces[capturedPiece.color]++;
                }
                board[capture.row][capture.col] = null;
            });
            
            // Превращение в дамку
            if ((piece.color === 'white' && move.to.row === 0) ||
                (piece.color === 'black' && move.to.row === 7)) {
                piece.isKing = true;
            }
            
            moveHistory.push(move);
            selectedPiece = null;
            validMoves = [];
            
            // Проверка на победу
            if (checkWin()) {
                gameOver();
                return;
            }
            
            // Переключение хода
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            
            // Если игра с ботом и ход бота
            if (isBotGame && currentPlayer !== playerColor) {
                setTimeout(() => botMove(), 1000);
            }
            
            renderBoard();
            updateScore();
        }
        
        // Ход бота
        function botMove() {
            const botPieces = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] && board[row][col].color === currentPlayer) {
                        const moves = getValidMoves(row, col);
                        if (moves.length > 0) {
                            botPieces.push({ row, col, moves });
                        }
                    }
                }
            }
            
            // Приоритет взятию
            let captureMoves = [];
            let normalMoves = [];
            
            botPieces.forEach(piece => {
                piece.moves.forEach(move => {
                    if (move.captures.length > 0) {
                        captureMoves.push(move);
                    } else {
                        normalMoves.push(move);
                    }
                });
            });
            
            const availableMoves = captureMoves.length > 0 ? captureMoves : normalMoves;
            if (availableMoves.length > 0) {
                const randomMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
                makeMove(randomMove);
            }
        }
        
        // Проверка на победу
        function checkWin() {
            const whitePieces = board.flat().filter(p => p && p.color === 'white').length;
            const blackPieces = board.flat().filter(p => p && p.color === 'black').length;
            
            return whitePieces === 0 || blackPieces === 0;
        }
        
        // Конец игры
        function gameOver() {
            isGameOver = true;
            const winner = currentPlayer === 'white' ? 'Белые' : 'Черные';
            
            const gameOverElement = document.createElement('div');
            gameOverElement.className = 'game-over';
            gameOverElement.innerHTML = `
                <h2>🏆 Победа!</h2>
                <p>${winner} выиграли!</p>
                <br>
                <button class="btn" onclick="location.reload()">Новая игра</button>
            `;
            
            document.querySelector('.board-container').appendChild(gameOverElement);
            
            // Отправка результата в бот
            tg.sendData(JSON.stringify({
                game_id: gameId,
                winner: currentPlayer,
                moves: moveHistory.length,
                captured: capturedPieces
            }));
        }
        
        // Обновление индикатора хода
        function updateTurnIndicator() {
            const turnDot = document.getElementById('turnDot');
            turnDot.className = `turn-dot ${currentPlayer}`;
        }
        
        // Обновление счета
        function updateScore() {
            document.getElementById('score').textContent = 
                `${capturedPieces.black} - ${capturedPieces.white}`;
        }
        
        // Инициализация
        initBoard();
        renderBoard();
        updateScore();
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            const board = document.getElementById('board');
            const size = Math.min(window.innerWidth * 0.8, 500);
            board.style.width = size + 'px';
            board.style.height = size + 'px';
        });
    </script>
</body>
</html>
